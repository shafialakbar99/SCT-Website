    <script>
      // Automatically clean up any stale or rogue service workers & cache storage
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister().catch(function() {});
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name).catch(function() {});
          }
        }).catch(function() {});
      }

        localStorage.removeItem('hf_db_leadership_members');
      } catch (e) {}
    </script>
